[package]
name = "tflow"
version = "0.1.0-alpha.3"
edition = "2024"
description = "A generic TUI workflow host for View-based CLI workflows"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
shell-words = "1.1.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
toml = "1.1.0"
avt = "0.18.0"
unicode-segmentation = "1.12"
unicode-width = "0.2.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
signal-hook = "0.3.18"
