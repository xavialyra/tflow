#!/usr/bin/env -S tflow -w
[workflow]
api = 1
name = "quick-picker"
entrypoint = "main"

[views.main]
engine = "picker"

[views.main.query]
type = "object"
prompt = { type = "string", default = "Select an action:" }

[views.main.picker]
items = [
    { display = "First Option", value = "first_option" },
    { display = "Second Option", value = "second_option" },
]

[views.main.bindings]
enter = "run"

[commands.run]
label = "Run"
type = "return"
value = "selected_option"
