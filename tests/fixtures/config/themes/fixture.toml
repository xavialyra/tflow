background = "terminal"

[tokens.accent]
foreground = "cyan"
bold = true

[tokens.muted]
foreground = "#696969"

[tokens.border]
foreground = "magenta"

[tokens.surface]
foreground = "terminal"
background = "terminal"

[tokens.surface-highlight]
