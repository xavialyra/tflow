# Development and integration-test theme.
[palette]
primary = "#BC7588"
muted = "#696969"
paper = "#F2E9E1"

[scheme]
primary = "palette:primary"
primary-container = "palette:paper"
on-primary-container = "palette:muted"
on-surface-variant = "palette:muted"
outline = "ansi:magenta"

[bindings.chrome-footer-key]
foreground = "scheme:primary"
background = "scheme:primary-container"
bold = true

[bindings.picker-selected]
foreground = "scheme:on-surface"
background = "scheme:surface"
bold = true

[bindings.picker-selected-muted]
foreground = "scheme:on-surface-variant"
background = "scheme:surface"
bold = true
