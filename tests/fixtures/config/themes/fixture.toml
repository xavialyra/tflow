# Development and integration-test theme.
[scheme]
accent = "#BC7588"
selection = "#F2E9E1"
on-selection = "#696969"
muted = "#696969"
border = "ansi:magenta"

[chrome.footer_key]
foreground = "scheme:accent"
background = "scheme:selection"
bold = true

[picker.selected]
foreground = "scheme:foreground"
background = "scheme:background"
bold = true

[picker.selected_muted]
foreground = "scheme:muted"
background = "scheme:background"
bold = true
