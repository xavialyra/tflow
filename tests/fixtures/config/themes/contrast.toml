# High-contrast scheme used by integration tests.
[palette]
cyan = "#00ffff"
black = "#000000"
blue = "#0000ff"
white = "#ffffff"

[scheme]
primary = "palette:cyan"
on-primary = "palette:black"
primary-container = "palette:cyan"
on-primary-container = "palette:black"
surface = "palette:blue"
surface-container = "palette:blue"
on-surface = "palette:white"
on-surface-variant = "palette:white"
outline = "palette:cyan"
error = "palette:cyan"
on-error = "palette:black"
