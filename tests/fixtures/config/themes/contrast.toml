# High-contrast scheme used by integration tests.
[scheme]
background = "#0000ff"
foreground = "#ffffff"
muted = "#ffffff"
accent = "#00ffff"
border = "#00ffff"
selection = "#00ffff"
on-selection = "#000000"
error = "#00ffff"
on-error = "#000000"

[picker.input_prefix]
foreground = "scheme:on-selection"

[picker.badge]
foreground = "scheme:on-selection"

[chrome.footer_key]
foreground = "scheme:on-selection"
