[workflow]
api = 1
name = "Native form example"
entrypoint = "input"

[views.main]
engine = "picker"

[views.main.picker]
show_input = false
items = [{ display = "Collect parameters", value = "create" }]

[views.main.bindings]
enter = "open"

[views.input]
engine = "form"
cancel_exit_code = 1

[views.input.query]
type = "object"
name = { type = "string", default = "" }
environment = { type = "enum", options = ["dev", "prod"], default = "dev" }
enabled = { type = "boolean", default = true }
spec = { type = "object", default = { fields = [{ name = "name", required = true }, { name = "environment", label = "Environment", type = "enum", options = ["dev", "prod"], value = "dev" }, { name = "enabled", label = "Enabled (true/false)", type = "boolean", value = true }] } }

[views.input.form.content]
file = "scripts/content.py"

[views.input.bindings]
enter = "submit"

[commands.open]
label = "Open form"
type = "call"
target = "form:input"
query = { name = "demo", environment = "dev", enabled = true }
presentation = { mode = "popup", width = 72, height = 20 }

[commands.open.return_processor]
type = "navigate"
file = "scripts/received.py"

[commands.submit]
label = "Submit"
type = "return"
file = "scripts/submit.py"

[views.result]
engine = "capture"

[views.result.query]
type = "object"
result = { type = "object" }

[views.result.capture.output]
file = "scripts/received.py"
