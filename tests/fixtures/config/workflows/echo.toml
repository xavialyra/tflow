[workflow]
api = 1
name = "echo"

[views.main]
alias = "echo"

[views.main.query]
type = "object"
message = { type = "string", default = "Hello from single-file workflow!" }

[views.main.engine]
type = "capture"

[views.main.engine.config]

[views.main.engine.config.output]
producer = "script"

[views.main.engine.config.output.handler]
script = '''#!/usr/bin/env python3
import json
import sys

request = json.load(sys.stdin)
parameters = request.get("context", {}).get("parameters", {})
message = parameters.get("message", "") if isinstance(parameters, dict) else ""
if not isinstance(message, str):
    raise SystemExit("echo message must be a string")
json.dump({"version": 1, "output": message}, sys.stdout, separators=(",", ":"))
sys.stdout.write("\n")
'''

[views.main.commands.copy]
key = "enter"
label = "Copy & Exit"
type = "return"
producer = "declared"

[views.main.commands.copy.handler]
value = ""

[views.main.commands.inline_multiline]
key = "ctrl+r"
label = "Run Multi-line Script"
type = "run"
producer = "script"

[views.main.commands.inline_multiline.handler]
script = '''#!/usr/bin/env python3
import json
import sys

request = json.load(sys.stdin)
parameters = request.get("context", {}).get("parameters", {})
message = parameters.get("message", "") if isinstance(parameters, dict) else ""
json.dump({
    "version": 1,
    "operation": {
        "type": "run",
        "mode": "foreground",
        "argv": ["python3", "-c", "import sys; print('ECHO_MULTILINE:' + sys.argv[1])", message],
        "exit": True,
    },
}, sys.stdout, separators=(",", ":"))
sys.stdout.write("\n")
'''

[views.main.commands.inline_single]
key = "ctrl+s"
label = "Run Single-line Script"
type = "run"
producer = "script"

