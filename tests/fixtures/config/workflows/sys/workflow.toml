[workflow]
api = 1
name = "system"
entrypoint = "main"

[views.main]
engine = "picker"

[views.main.picker.items]
file = "scripts/items.sh"

[views.main.bindings]
enter = "run"
"" = "info"

[commands.run]
label = "Run"
type = "navigate"
file = "scripts/command.sh"

[commands.info]
label = "Info"
type = "navigate"
file = "scripts/command.sh"

[views.output]
engine = "capture"

[views.output.capture.output]
file = "scripts/run.sh"
