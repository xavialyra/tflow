[workflow]
api = 1
name = "selectors"
entrypoint = "commands"

[views.commands]

[views.commands.engine]
type = "picker"

[views.commands.engine.config]
show_input = false
show_divider = false

[views.commands.engine.config.items]
producer = "script"
[views.commands.engine.config.items.handler]
file = "scripts/commands.sh"

[views.commands.query]
type = "object"
input_order = ["search"]
search = { type = "string", default = "" }
commands = { type = "array<object>", default = [] }

[views.commands.keymap]
enter = "accept"

[views.views]

[views.views.engine]
type = "picker"

[views.views.engine.config.items]
producer = "script"

[views.views.engine.config.items.handler]
file = "scripts/views.sh"

[views.views.keymap]
enter = "open"

[commands.accept]
label = "Select"
scope = "selection"
type = "return"
producer = "script"
[commands.accept.handler]
file = "scripts/result.sh"

[commands.open]
label = "Open View"
type = "navigate"
producer = "script"
[commands.open.handler]
file = "scripts/open-view.sh"
