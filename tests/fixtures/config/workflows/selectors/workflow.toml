[workflow]
api = 1
name = "selectors"

[views.commands]
alias = "commands"

[views.commands.engine]
type = "picker"

[views.commands.engine.config]
show_input = false
show_divider = false

[views.commands.engine.config.items]
producer = "script"
[views.commands.engine.config.items.handler]
file = "scripts/commands.sh"

[views.commands.query]
type = "object"
input_order = ["search"]
search = { type = "string", default = "" }
commands = { type = "array<object>", default = [] }

[views.commands.commands.accept]
key = "enter"
label = "Select"
scope = "selection"
type = "return"
producer = "script"
[views.commands.commands.accept.handler]
file = "scripts/result.sh"

[views.views]
alias = "view"

[views.views.engine]
type = "picker"

[views.views.engine.config.items]
producer = "script"

[views.views.engine.config.items.handler]
file = "scripts/views.sh"

[views.views.commands.open]
key = "enter"
label = "Open View"
type = "navigate"
producer = "script"

[views.views.commands.open.handler]
file = "scripts/open-view.sh"
