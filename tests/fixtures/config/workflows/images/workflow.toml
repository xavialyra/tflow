[workflow]
api = 1
name = "images"

[views.menu]
alias = "images"

[views.menu.engine]
type = "picker"

[views.menu.engine.config]
preview_ratio = 0.35
preview_min_width = 24
preview_default_open = false

[views.menu.engine.config.items]
producer = "script"
[views.menu.engine.config.items.handler]
file = "scripts/items.sh"

[views.menu.engine.config.preview]
producer = "script"
[views.menu.engine.config.preview.handler]
file = "scripts/preview.py"
