[workflow]
api = 1
name = "applications"
entrypoint = "main"

[views.main]
engine = "picker"
companion = "preview"

[views.main.picker]
input_placeholder = "Search applications"

[views.main.picker.items]
file = "scripts/items.sh"

[views.preview]
engine = "capture"

[views.preview.capture.output]
file = "scripts/preview.py"

[views.main.bindings]
"ctrl+p" = "toggle_companion"
enter = "open"
"ctrl+o" = "openx"
"ctrl+w" = "weight"

[views.weight]
engine = "form"
[views.weight.query]
type = "object"
input = "app"
app = { type = "string", default = "" }

[views.weight.form.content]
file = "scripts/weight-content.sh"

[views.weight.bindings]
enter = "save"

[commands.open]
label = "Open"
type = "run"
file = "scripts/open.sh"

[commands.openx]
label = "Opend"
type = "run"
file = "scripts/open.sh"

[commands.weight]
label = "Set weight"
type = "call"
file = "scripts/weight-popup.sh"

[commands.save]
label = "Save"
type = "return"
file = "scripts/set-weight.sh"

[commands.toggle_companion]
label = "Toggle Companion"
companion = "preview"
