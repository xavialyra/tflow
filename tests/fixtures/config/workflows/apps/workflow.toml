[workflow]
api = 1
name = "applications"
entrypoint = "main"

[views.main]

[views.main.engine]
type = "picker"

[views.main.preview]
file = "scripts/preview.py"
width = "35%"
min_width = 24
open = false

[views.main.engine.config]
input_placeholder = "Search applications"

[views.main.engine.config.items]
producer = "script"
[views.main.engine.config.items.handler]
file = "scripts/items.sh"

[views.main.bindings]
enter = "open"
"ctrl+o" = "openx"
"ctrl+w" = "weight"

[views.weight]
[views.weight.query]
type = "object"
input = "app"
app = { type = "string", default = "" }

[views.weight.engine]
type = "form"

[views.weight.engine.config.content]
producer = "script"
[views.weight.engine.config.content.handler]
file = "scripts/weight-content.sh"

[views.weight.bindings]
enter = "save"

[commands.open]
label = "Open"
type = "run"
producer = "script"
[commands.open.handler]
file = "scripts/open.sh"

[commands.openx]
label = "Opend"
type = "run"
producer = "script"
[commands.openx.handler]
file = "scripts/open.sh"

[commands.weight]
label = "Set weight"
type = "call"
producer = "script"
[commands.weight.handler]
file = "scripts/weight-popup.sh"

[commands.save]
label = "Save"
type = "return"
producer = "script"
[commands.save.handler]
file = "scripts/set-weight.sh"
