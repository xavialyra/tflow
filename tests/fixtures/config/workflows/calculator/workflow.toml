[workflow]
api = 1
name = "calculator"
entrypoint = "main"

[views.main]
engine = "picker"

[views.main.picker.items]
file = "scripts/items.py"

[views.main.bindings]
enter = "copy"

[commands.copy]
label = "Copy result"
type = "run"
producer = "script"

[commands.copy.handler]
file = "scripts/copy.py"
