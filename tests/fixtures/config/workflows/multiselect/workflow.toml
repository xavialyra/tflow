[workflow]
api = 1
name = "Multi-Select Picker"
entrypoint = "main"

[styles.checked]
foreground = "scheme:accent"
bold = true

[styles.checked.selected]
foreground = "scheme:accent"
bold = true

[styles.unchecked]
dim = true

[styles.summary]
foreground = "scheme:accent"
bold = true

[views.main]
engine = "picker"

[views.main.query]
type = "object"
input = "search"
search = { type = "string", default = "" }
selected = { type = "array<string>", default = [] }

[views.main.picker.items]
file = "scripts/items.py"

[views.main.picker.preview]
file = "scripts/preview.py"
width = "40%"
min_width = 24
open = true

[views.main.bindings]
tab = "toggle"
"ctrl+a" = "select_all"
"ctrl+r" = "clear_all"
enter = "submit"

[commands.toggle]
label = "Toggle select"
type = "navigate"
file = "scripts/toggle.py"

[commands.select_all]
label = "Select all"
type = "navigate"
file = "scripts/select_all.py"

[commands.clear_all]
label = "Clear all"
type = "navigate"
file = "scripts/clear.py"

[commands.submit]
label = "Confirm selection"
type = "run"
file = "scripts/submit.py"
