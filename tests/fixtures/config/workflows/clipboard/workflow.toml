[workflow]
api = 1
name = "Clipboard History"

[styles.history_icon]
foreground = "scheme:accent"
bold = true

[styles.history_icon.selected]
foreground = "scheme:accent"
bold = true

[views.default]
alias = "clipboard"

[views.default.engine]
type = "picker"

[views.default.engine.config]
preview_ratio = 0.35
preview_min_width = 24
preview_default_open = true

[views.default.engine.config.items]
producer = "script"

[views.default.engine.config.items.handler]
file = "scripts/items.py"

[views.default.engine.config.preview]
producer = "script"
[views.default.engine.config.preview.handler]
file = "scripts/preview.py"

[views.default.commands.copy]
key = "enter"
label = "Restore"
type = "run"
producer = "script"

[views.default.commands.copy.handler]
file = "scripts/restore.py"

[views.default.keymap]
escape = "back"
"ctrl+p" = "toggle_preview"
