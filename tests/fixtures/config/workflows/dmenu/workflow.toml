[workflow]
api = 1
name = "dmenu"

[views.main]
alias = "dmenu"
cancel_exit_code = 1

[views.main.engine]
type = "picker"

[views.main.engine.config]

[views.main.engine.config.items]
producer = "script"
[views.main.engine.config.items.handler]
file = "scripts/items.sh"

[views.main.query]
type = "object"
input_order = ["initial"]
initial = { type = "string", default = "" }
index = { type = "boolean", default = false }
with-nth = { type = "string", nullable = true }
accept-nth = { type = "string", nullable = true }
match-nth = { type = "string", nullable = true }
nth-delimiter = { type = "string", nullable = true }

[views.main.keymap]
"escape" = "exit"

[views.main.commands.accept]
key = "enter"
label = "Accept"
requires = "input"
type = "return"
producer = "script"
[views.main.commands.accept.handler]
file = "scripts/result.sh"

[views.main.commands.copy]
label = "Copy selection"
requires = "input"
type = "return"
producer = "script"
[views.main.commands.copy.handler]
file = "scripts/result.sh"
