[workflow]
api = 1
name = "core"
entrypoint = "default"

[views.default.engine]
type = "picker"

[views.default.engine.config]
items = [
  { display = "Termius", value = "termius", bindings = { enter = "apps:open" } },
  { display = "Calculator", value = "calculator", bindings = { enter = "calculator:copy" } },
  { display = "Lock Screen", value = "lock", bindings = { enter = "sys:run" } },
]
