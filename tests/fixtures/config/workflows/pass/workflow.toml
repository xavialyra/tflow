[workflow]
api = 1
name = "pass"
entrypoint = "main"

[views.main]

[views.main.engine]
type = "picker"

[views.main.engine.config.items]
producer = "script"

[views.main.engine.config.items.handler]
file = "scripts/items.py"

[views.main.keymap]
enter = "copy"
"ctrl+o" = "otp"

[views.unlock]

[views.unlock.query]
type = "object"
input_order = ["entry"]
entry = { type = "string" }

[views.unlock.engine]
type = "form"

[views.unlock.engine.config.content]
producer = "script"
[views.unlock.engine.config.content.handler]
script = '''#!/bin/sh
cat << 'EOF'
{
  "version": 1,
  "content": {
    "fields": [
      {
        "name": "passphrase",
        "label": "GPG Passphrase:",
        "type": "password",
        "required": true
      }
    ]
  }
}
EOF
'''

[views.unlock.keymap]
enter = "submit"

[commands.copy]
label = "Copy password"
type = "call"
producer = "script"

[commands.copy.handler]
file = "scripts/copy.py"

[commands.otp]
label = "Copy OTP"
type = "run"
producer = "script"

[commands.otp.handler]
file = "scripts/otp.py"

[commands.submit]
label = "Unlock & Copy"
type = "run"
producer = "script"

[commands.submit.handler]
file = "scripts/unlock.py"
