[workflow]
api = 1
name = "pass"

[views.main]
alias = "pass"

[views.main.engine]
type = "picker"

[views.main.engine.config.items]
producer = "script"

[views.main.engine.config.items.handler]
file = "scripts/items.py"

[views.main.commands.copy]
key = "enter"
label = "Copy password"
type = "call"
producer = "script"

[views.main.commands.copy.handler]
file = "scripts/copy.py"

[views.main.commands.otp]
key = "ctrl+o"
label = "Copy OTP"
type = "run"
producer = "script"

[views.main.commands.otp.handler]
file = "scripts/otp.py"

[views.unlock]
alias = "unlock"

[views.unlock.query]
type = "object"
input_order = ["entry"]
entry = { type = "string" }

[views.unlock.engine]
type = "form"

[views.unlock.engine.config.content]
producer = "script"
[views.unlock.engine.config.content.handler]
script = '''#!/bin/sh
cat << 'EOF'
{
  "version": 1,
  "content": {
    "fields": [
      {
        "name": "passphrase",
        "label": "GPG Passphrase:",
        "type": "password",
        "required": true
      }
    ]
  }
}
EOF
'''

[views.unlock.commands.submit]
key = "enter"
label = "Unlock & Copy"
type = "run"
producer = "script"

[views.unlock.commands.submit.handler]
file = "scripts/unlock.py"
