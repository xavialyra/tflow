[workflow]
api = 1
name = "shell"
entrypoint = "menu"

[views.menu]
engine = "picker"

[views.menu.picker]
items = [{ display = "Open shell" }]

[views.menu.bindings]
enter = "open"

[commands.open]
label = "Open shell"
type = "navigate"
target = "shell:main"

[views.main]
engine = "embedded"

[views.main.embedded]
command = ["sh"]
