[workflow]
api = 1
name = "shell"
entrypoint = "menu"

[views.menu]

[views.menu.engine]
type = "picker"

[views.menu.engine.config]
items = [{ display = "Open shell" }]

[views.menu.commands.open]
key = "enter"
label = "Open shell"
type = "navigate"
producer = "declared"

[views.menu.commands.open.handler]
target = "shell:main"

[views.main.engine]
type = "embedded"

[views.main.engine.config]
command = ["sh"]
