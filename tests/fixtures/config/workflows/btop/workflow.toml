[workflow]
api = 1
name = "btop resource monitor"

[views.main]
alias = "btop"

[views.main.query]
type = "object"
input_order = ["resource"]
resource = { type = "string", default = "cpu" }
next = { type = "object", default = { resource = "memory", next = { resource = "network", next = { resource = "processes", next = { resource = "cpu" } } } } }

[views.main.engine]
type = "embedded"

[views.main.engine.config]
command = ["sh", "scripts/btop-entry.sh"]
escape-cancels = true

[views.main.commands.next]
key = "tab"
label = "Next resource"
scope = "view"
requires = "input"
passthrough = true
type = "navigate"
producer = "script"

[views.main.commands.next.handler]
file = "scripts/next.sh"

[views.main.commands.reset]
label = "Reset monitor"
scope = "view"
requires = "input"
passthrough = true
type = "navigate"
producer = "declared"

[views.main.commands.reset.handler]
target = "btop:main"
replace = true
