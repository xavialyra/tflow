[workflow]
api = 1
name = "btop resource monitor"
entrypoint = "main"

[views.main]

[views.main.query]
type = "object"
input = "resource"
resource = { type = "string", default = "cpu" }
next = { type = "object", default = { resource = "memory", next = { resource = "network", next = { resource = "processes", next = { resource = "cpu" } } } } }

[views.main.engine]
type = "embedded"

[views.main.engine.config]
command = ["sh", "scripts/btop-entry.sh"]
escape-cancels = true

[views.main.keymap]
tab = "next"
"" = "reset"

[commands.next]
label = "Next resource"
type = "navigate"
producer = "script"

[commands.next.handler]
file = "scripts/next.sh"

[commands.reset]
label = "Reset monitor"
type = "navigate"
producer = "declared"

[commands.reset.handler]
target = "btop:main"
replace = true
