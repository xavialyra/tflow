# Development and integration-test fixture; not a distributed default configuration.
# theme = "fixture"
image_protocol = "sixel"
[capture.bindings]
"enter" = "copy"
"escape" = "back"

[picker]
left_prefix = "$route"
left_prefix_backspace = "root"

[picker.bindings]
"ctrl+c" = "exit"
"ctrl+d" = "exit"
"escape" = "back"
"up" = "select_previous"
"down" = "select_next"
"backspace" = "delete_backward"
"ctrl+u" = "clear_input"
"ctrl+w" = "delete_word"
