# Development and integration-test fixture; not a distributed default configuration.
# theme = "fixture"
image_protocol = "sixel"
[defaults.capture.bindings]
copy = ["enter"]
back = ["escape"]

[defaults.picker.bindings]
exit = ["ctrl+c", "ctrl+d"]
toggle_preview = ["ctrl+p"]
back = ["escape"]
select_previous = ["up"]
select_next = ["down"]
delete_backward = ["backspace"]
clear_input = ["ctrl+u"]
delete_word = ["ctrl+w"]
