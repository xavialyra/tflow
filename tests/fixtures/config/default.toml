[suite]
api = 1
name = "Development Fixtures"

[suite.entrypoint]
target = "core:default"
query = { sources = ["apps:main", "calculator:main", "sys:main"] }

[workflows]
apps = { dir = "./workflows/apps" }
calculator = { dir = "./workflows/calculator" }
core = { dir = "./workflows/core" }
dmenu = { dir = "./workflows/dmenu" }
echo = { file = "./workflows/echo.toml" }
form = { dir = "./workflows/form" }
multiselect = { dir = "./workflows/multiselect" }
recipe = { file = "./workflows/recipe.toml" }
shell = { dir = "./workflows/shell" }
sys = { dir = "./workflows/sys" }

[aliases]
app = "apps:main"
form-demo = "form:main"
form = "form:input"
sys = "sys:main"
echo = "echo:main"
calc = "calculator:main"
