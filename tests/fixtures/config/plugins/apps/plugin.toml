[plugin]
api = 1
name = "applications"

[views.main]
alias = "app"

[views.main.engine]
type = "picker"

[views.main.engine.config]
[views.main.engine.config.items]
source = "script"
file = "scripts/items.sh"
args = ["{{ view.query }}"]

[views.main.commands.open]
key = "enter"
label = "Open"
type = "run"

[views.main.commands.open.payload]
handler = { source = "script", file = "scripts/open.sh" }
args = ["{{ selection.value }}"]
