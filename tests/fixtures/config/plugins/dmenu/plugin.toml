[plugin]
api = 1
name = "dmenu"

[views.main]
alias = "dmenu"
cancel_exit_code = 1

[views.main.engine]
type = "picker"

[views.main.engine.config]
show_prefix = false

[views.main.engine.config.items]
source = "script"
file = "scripts/items.sh"
args = ["{{ input }}", "{{ view.query }}"]
max_output_bytes = 67108864

[views.main.query]
type = "object"
input_order = ["initial"]
initial = { type = "string", default = "" }
dmenu0 = { type = "boolean", default = false }
index = { type = "boolean", default = false }
with-nth = { type = "string", nullable = true }
accept-nth = { type = "string", nullable = true }
match-nth = { type = "string", nullable = true }
nth-delimiter = { type = "string", nullable = true }

[views.main.keymap]
"escape" = "exit"

[views.main.commands.accept]
key = "enter"
label = "Accept"
requires = "input"
type = "return"

[views.main.commands.accept.payload]
handler = "scripts/result.sh"
args = [
  "{{ view.query }}",
  "{{ input.stdin }}",
  "{{ selection }}",
  "{{ page.input }}",
]
