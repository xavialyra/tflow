[plugin]
api = 1
name = "translation"

[views.main]
alias = "tr"

[views.main.engine]
type = "picker"

[views.main.engine.config]
[views.main.engine.config.items]
source = "script"
file = "scripts/items.sh"
args = ["{{ view.query }}"]

[views.main.query]
type = "object"
input_order = ["source", "target", "text"]
source = { type = "string", nullable = true }
target = { type = "string", nullable = true }
text = { type = "string", default = "" }
