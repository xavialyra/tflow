[plugin]
api = 1
name = "shell"

[views.menu]
alias = "shell"

[views.menu.engine]
type = "picker"

[views.menu.engine.config]
items = [{ label = "Open shell" }]

[views.menu.commands.open]
key = "enter"
label = "Open shell"
type = "navigate"

[views.menu.commands.open.payload]
target = "shell:main"
query = "exec sh"

[views.main.engine]
type = "embedded"

[views.main.engine.config]
command = ["sh", "-lc", "{{ view.input }}"]
title = "{{ view.ref }}"
