[plugin]
api = 1
name = "selectors"

[views.commands]
alias = "commands"

[views.commands.engine]
type = "picker"

[views.commands.engine.config]
show_prefix = true

[views.commands.engine.config.items]
source = "script"
file = "scripts/commands.sh"
args = ["{{ view.query.commands }}", "{{ view.query.search }}"]

[views.commands.query]
type = "object"
input_order = ["search"]
search = { type = "string", default = "" }
commands = { type = "array<object>", default = [] }

[views.commands.commands.accept]
key = "enter"
label = "Select"
scope = "selection"
requires = "items"
type = "return"

[views.commands.commands.accept.payload]
value = "{{ selection.metadata.command }}"
