[plugin]
api = 1
name = "system"

[views.main]
alias = "sys"

[views.main.engine]
type = "picker"

[views.main.engine.config]
items = '{{ script("scripts/items.sh", this:query) }}'

[views.main.commands.run]
key = "enter"
label = "Run"
type = "navigate"

[views.main.commands.run.payload]
target = "sys:output"
query = "{{ runtime:view.current.selected_item.text }}"

[views.output.engine]
type = "capture"

[views.output.engine.config]
output = '{{ script("scripts/run.sh", this:query) }}'
title = "{{ this:ref }}"
