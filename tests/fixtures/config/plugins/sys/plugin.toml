[plugin]
api = 1
name = "system"

[views.main]
alias = "sys"

[views.main.engine]
type = "picker"

[views.main.engine.config]
[views.main.engine.config.items]
source = "script"
file = "scripts/items.sh"
args = ["{{ view.query }}"]

[views.main.commands.run]
key = "enter"
label = "Run"
type = "navigate"

[views.main.commands.run.payload]
target = "sys:output"
query = "{{ selection.text }}"

[views.main.commands.info]
label = "Info"
type = "navigate"

[views.main.commands.info.payload]
target = "sys:output"
query = "{{ selection.text }}"

[views.output.engine]
type = "capture"

[views.output.engine.config]
title = "{{ view.ref }}"

[views.output.engine.config.output]
source = "script"
file = "scripts/run.sh"
args = ["{{ view.query }}"]
