# Built-in Default Theme ("terminal")
#
# This file serves as both the built-in fallback theme and the canonical
# reference template for authoring custom themes in `themes/<name>.toml`.

[scheme]
background = "ansi:reset"
foreground = "ansi:reset"
muted = "ansi:bright-black"
accent = "ansi:yellow"
surface = "ansi:black"
border = "ansi:yellow"
selection = "ansi:reset"
on-selection = "ansi:reset"
error = "ansi:red"
on-error = "ansi:white"

# -----------------------------------------------------------------------------
# Chrome / Outer Framing Component Styles
# -----------------------------------------------------------------------------
[chrome.text]
foreground = "scheme:foreground"
background = "scheme:background"

[chrome.divider]
foreground = "scheme:border"
background = "scheme:background"

[chrome.border]
foreground = "scheme:border"
background = "scheme:background"

[chrome.footer]
foreground = "scheme:muted"
background = "scheme:background"

[chrome.footer_title]
foreground = "scheme:accent"
background = "scheme:background"
bold = true

[chrome.footer_status]
foreground = "scheme:muted"
background = "scheme:background"

[chrome.footer_key]
foreground = "scheme:accent"
background = "scheme:surface"
bold = true

[chrome.error]
foreground = "scheme:on-error"
background = "scheme:error"
bold = true

# -----------------------------------------------------------------------------
# Picker List & Preview Component Styles
# -----------------------------------------------------------------------------
[picker.text]
foreground = "scheme:foreground"
background = "scheme:background"

[picker.muted]
foreground = "scheme:muted"
background = "scheme:background"

[picker.selected]
foreground = "scheme:on-selection"
background = "scheme:selection"
bold = true

[picker.selected_muted]
foreground = "scheme:muted"
background = "scheme:selection"
bold = true

[picker.badge]
foreground = "scheme:muted"
background = "scheme:background"

[picker.badge.selected]
foreground = "scheme:muted"
background = "scheme:selection"
bold = true

[picker.marker]
foreground = "scheme:accent"
background = "scheme:background"
bold = true

[picker.scrollbar]
foreground = "scheme:border"
background = "scheme:border"
bold = true

[picker.input_prefix]
foreground = "scheme:accent"
background = "scheme:surface"
bold = true

[picker.cursor]
foreground = "scheme:accent"
background = "scheme:background"
bold = true

[picker.preview.text]
foreground = "scheme:foreground"
background = "scheme:background"

[picker.preview.border]
foreground = "scheme:border"
background = "scheme:background"

[picker.preview.error]
foreground = "scheme:on-error"
background = "scheme:error"

# -----------------------------------------------------------------------------
# Capture Component Styles
# -----------------------------------------------------------------------------
[capture.text]
foreground = "scheme:foreground"
background = "scheme:background"

[form.label]
foreground = "scheme:accent"
background = "scheme:background"
bold = true

[form.input]
foreground = "scheme:foreground"
background = "scheme:background"

[form.focused]
foreground = "scheme:foreground"
background = "scheme:selection"

[form.error]
foreground = "scheme:on-error"
background = "scheme:error"
