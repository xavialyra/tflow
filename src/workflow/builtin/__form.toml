[workflow]
api = 1
name = "Built-in Form"

[views.main]
[views.main.engine]
type = "form"

[views.main.engine.config.content]
producer = "script"
[views.main.engine.config.content.handler]
script = '''#!/usr/bin/env python3
import json
import sys

request = json.load(sys.stdin)
parameters = request.get("context", {}).get("parameters", {})
payload_text = parameters.get("payload") if isinstance(parameters, dict) else None
if not isinstance(payload_text, str):
    raise SystemExit("parameter form payload is missing")
try:
    payload = json.loads(payload_text)
except json.JSONDecodeError as error:
    raise SystemExit(f"parameter form payload is invalid: {error}")
query = payload.get("query") if isinstance(payload, dict) else None
values = payload.get("values") if isinstance(payload, dict) else None
if not isinstance(query, dict):
    raise SystemExit("parameter form query definition is missing")

fields = []
query_type = query.get("type", "string")
if query_type == "string":
    if not isinstance(values, str):
        raise SystemExit("string query values are invalid")
    fields.append({"name": "query", "label": "Query", "type": "string", "value": values})
elif query_type == "object":
    order = query.get("input_order", [])
    if not isinstance(order, list) or not all(isinstance(name, str) for name in order):
        raise SystemExit("query input_order is invalid")
    names = []
    for name in order:
        if name not in names:
            names.append(name)
    names.extend(sorted(
        name for name in query
        if name not in ("type", "input_order") and name not in names
    ))
    if not isinstance(values, dict):
        raise SystemExit("object query values are invalid")
    for name in names:
        definition = query.get(name)
        if not isinstance(definition, dict) or not isinstance(definition.get("type"), str):
            raise SystemExit(f"query field {name!r} is invalid")
        type_name = definition["type"]
        if type_name in ("string", "password", "integer", "number", "boolean"):
            field_type = type_name
        elif type_name == "object" or type_name.startswith("array<"):
            field_type = "json"
        else:
            raise SystemExit(f"query field {name!r} has unsupported type {type_name!r}")
        value = values.get(name, definition.get("default"))
        field = {
            "name": name,
            "label": name,
            "type": field_type,
            "required": "default" not in definition and not definition.get("nullable", False),
            "value": value,
        }
        fields.append(field)
else:
    raise SystemExit(f"query type {query_type!r} is unsupported")

json.dump({"version": 1, "content": {"fields": fields}}, sys.stdout, separators=(",", ":"))
sys.stdout.write("\n")
'''

[views.main.query]
type = "object"
input_order = ["payload"]
payload = { type = "string", default = "" }

[views.main.commands.accept]
key = "enter"
label = "Apply"
scope = "selection"
type = "return"
producer = "script"
[views.main.commands.accept.handler]
script = '''#!/usr/bin/env python3
import json
import sys

request = json.load(sys.stdin)
context = request.get("context", {})
parameters = context.get("parameters", {})
state = context.get("engine", {}).get("state", {})
payload_text = parameters.get("payload") if isinstance(parameters, dict) else None
if not isinstance(payload_text, str) or not isinstance(state, dict):
    raise SystemExit("parameter form request is invalid")
try:
    payload = json.loads(payload_text)
except json.JSONDecodeError as error:
    raise SystemExit(f"parameter form payload is invalid: {error}")
target = payload.get("target") if isinstance(payload, dict) else None
query = payload.get("query") if isinstance(payload, dict) else None
values = state.get("values")
if not isinstance(target, str) or not target or not isinstance(query, dict):
    raise SystemExit("parameter form target is invalid")
if state.get("valid") is not True or not isinstance(values, dict):
    raise SystemExit("parameter form values are invalid")
if query.get("type", "string") == "string":
    parameters_value = values.get("query")
    if not isinstance(parameters_value, str):
        raise SystemExit("parameter form string value is invalid")
else:
    for name, definition in query.items():
        if isinstance(definition, dict) and definition.get("nullable", False):
            if values.get(name) == "":
                values[name] = None
    parameters_value = values
json.dump({
    "version": 1,
    "operation": {
        "type": "return",
        "value": {"target": target, "parameters": parameters_value},
    },
}, sys.stdout, separators=(",", ":"))
sys.stdout.write("\n")
'''
