[workflows.__builtin]
name = "Built-in Views"

[workflows.__builtin.views.command_picker]
alias = "Commands"

[workflows.__builtin.views.command_picker.engine]
type = "picker"

[workflows.__builtin.views.command_picker.engine.config]
show_input = false
show_divider = false

[workflows.__builtin.views.command_picker.engine.config.items]
producer = "script"

[workflows.__builtin.views.command_picker.engine.config.items.handler]
script = '''#!/usr/bin/env python3
import json
import sys

request = json.load(sys.stdin)
commands = request.get("context", {}).get("parameters", {}).get("commands", [])
items = []
for command in commands:
    if not isinstance(command, dict):
        continue
    reference = command.get("ref")
    if not isinstance(reference, dict):
        continue
    label = command.get("label") or reference.get("id", "")
    item = {
        "display": label,
        "value": json.dumps(reference, separators=(",", ":")),
        "metadata": {"command": reference},
    }
    items.append(item)
json.dump({"version": 1, "items": items}, sys.stdout, separators=(",", ":"))
sys.stdout.write("\n")
'''

[workflows.__builtin.views.command_picker.query]
type = "object"
commands = { type = "array<object>", default = [] }

[workflows.__builtin.views.command_picker.commands.select]
key = "enter"
label = "Select"
type = "return"
producer = "script"

[workflows.__builtin.views.command_picker.commands.select.handler]
script = '''#!/usr/bin/env python3
import json
import sys

request = json.load(sys.stdin)
state = request.get("context", {}).get("engine", {}).get("state", {})
item = state.get("item") if isinstance(state, dict) else None
metadata = item.get("metadata", {}) if isinstance(item, dict) else {}
reference = metadata.get("command") if isinstance(metadata, dict) else None
if not isinstance(reference, dict):
    raise SystemExit("command picker selection has no command reference")
json.dump({
    "version": 1,
    "operation": {"type": "return", "value": reference},
}, sys.stdout, separators=(",", ":"))
sys.stdout.write("\n")
'''
