# Built-in configuration. User configuration is merged on top of this file.

[providers.default-info]
display_prefix = "sys"
discover = '''
printf '%s\n' '{"label":"Show date"}' '{"label":"Show system information"}'
'''
run = '''
case "$LAUNCHER_ITEM" in
  "Show date") date ;;
  "Show system information")
    uname -a
    printf '\n'
    id
    ;;
esac
'''
mode = "capture"

[providers.default-shell]
display_prefix = "shell"
discover = '''
printf '%s\n' '{"label":"Open shell"}'
'''
run = '''
exec sh
'''
mode = "embedded"

[providers.trans]
display_prefix = "tr"
discover_shell = "bash"
filter = false
query_discover = '''
command -v trans >/dev/null 2>&1 || exit 0
command -v jq >/dev/null 2>&1 || exit 0
case "$LAUNCHER_QUERY" in
  *" "*) ;;
  *) exit 0 ;;
esac
text="${LAUNCHER_QUERY#* }"
[ -n "${text//[[:space:]]/}" ] || exit 0
read -r -a args <<< "$LAUNCHER_QUERY"
trans -b -no-ansi "${args[@]}" |
jq -R -c --arg query "$LAUNCHER_QUERY" '{label: ., value: ., metadata: {query: $query}}'
'''

[providers.fzf-apps]
display_prefix = "app"
discover_shell = "bash"
filter = false
default_discover = '''
command -v fzf >/dev/null 2>&1 || exit 0
command -v jq >/dev/null 2>&1 || exit 0
cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/tui-launcher"
cache_file="$cache_dir/desktop-apps-v2.list"
refresh=true
if [ -s "$cache_file" ]; then
  cache_mtime=$(stat -c %Y "$cache_file" 2>/dev/null || printf '0')
  now=$(date +%s)
  [ "$((now - cache_mtime))" -lt 300 ] && refresh=false
fi
if $refresh; then
  mkdir -p "$cache_dir" || exit 0
  tmp_file="$cache_file.$$"
  trap 'rm -f "$tmp_file"' EXIT
  data_home="${XDG_DATA_HOME:-$HOME/.local/share}"
  data_dirs="${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
  for base in "$data_home" $(printf '%s' "$data_dirs" | tr ':' ' '); do
    dir="$base/applications"
    [ -d "$dir" ] || continue
    find "$dir" -maxdepth 1 -type f -name '*.desktop' -print
  done |
  while IFS= read -r file; do
    name=$(sed -n 's/^Name=//p' "$file" | head -n 1)
    if [ -n "$name" ]; then
      item=$(jq -cn --arg label "$name" --arg value "$file" \
        '{label: $label, value: $value, metadata: {desktop_file: $value}}')
      printf '%s\t%s\n' "$name" "$item"
    fi
  done > "$tmp_file"
  mv "$tmp_file" "$cache_file" || exit 0
fi
fzf --filter="$LAUNCHER_QUERY" --no-sort --delimiter=$'\t' --nth=1 --accept-nth=2 < "$cache_file"
'''
query_discover = '''
command -v fzf >/dev/null 2>&1 || exit 0
cache_file="${XDG_CACHE_HOME:-$HOME/.cache}/tui-launcher/desktop-apps-v2.list"
[ -s "$cache_file" ] || exit 0
exec fzf --filter="$LAUNCHER_QUERY" --no-sort --delimiter=$'\t' --nth=1 --accept-nth=2 < "$cache_file"
'''
run = '''
gio launch "$LAUNCHER_VALUE"
'''
mode = "oneshot"
