[plugin]
api = 1
name = "translation"

[views.default]
alias = "tr"

[views.default.engine]
type = "picker"

[views.default.engine.config]
items = '''{{ script("scripts/items.sh", this:query) }}'''

[views.default.query]
type = "object"
input_order = ["source", "target", "text"]
source = '''{{ state("string", null) }}'''
target = '''{{ state("string", null) }}'''
text = '''{{ state("string", "") }}'''
