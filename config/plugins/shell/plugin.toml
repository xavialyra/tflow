[plugin]
api = 1
name = "shell"

[views.menu]
type = "picker"
alias = "shell"
items = '{{ script("scripts/items.sh", runtime:view.active.query) }}'

[views.menu.commands.open]
key = "enter"
label = "Open shell"
view = "shell:default"
input = "exec sh"

[views.default]
type = "embedded"
command = ["sh", "-lc", "{{ runtime:view.active.input }}"]
title = "{{ runtime:view.active.ref }}"
