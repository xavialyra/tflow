[plugin]
api = 2

[views.menu]
type = "launcher"
display_prefix = "shell"
items = '{{ script("scripts/items.sh", runtime:view.current.query) }}'

[views.menu.commands.open]
key = "enter"
label = "Open shell"
view = "shell:default"
input = "exec sh"

[views.default]
type = "embedded"
command = ["sh", "-lc", "{{ runtime:view.current.input }}"]
title = "{{ runtime:view.current.ref }}"
