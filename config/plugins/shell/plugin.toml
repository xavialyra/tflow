[plugin]
api = 1
name = "shell"

[views.menu]
alias = "shell"

[views.menu.engine]
type = "picker"

[views.menu.engine.config]
items = [{ label = "Open shell" }]

[views.menu.commands.open]
key = "enter"
label = "Open shell"
type = "navigate"

[views.menu.commands.open.payload]
target = "shell:default"
query = "exec sh"

[views.default.engine]
type = "embedded"

[views.default.engine.config]
command = ["sh", "-lc", "{{ this:input }}"]
title = "{{ this:ref }}"
