[plugin]
api = 1
name = "shell"

[views.menu]
alias = "shell"

[views.menu.engine]
type = "picker"

[views.menu.engine.config]
items = '{{ script("scripts/items.sh", this:query) }}'

[views.menu.commands.open]
key = "enter"
label = "Open shell"
type = "navigate"

[views.menu.commands.open.payload]
target = "shell:default"
query = "exec sh"

[views.default.engine]
type = "embedded"

[views.default.engine.config]
command = ["sh", "-lc", "{{ runtime:view.active.input }}"]
title = "{{ runtime:view.active.ref }}"
