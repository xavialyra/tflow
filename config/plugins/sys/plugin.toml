[plugin]
api = 1
name = "system"

[views.default]
alias = "sys"

[views.default.engine]
type = "picker"

[views.default.engine.config]
items = '{{ script("scripts/items.sh", this:query) }}'

[views.default.commands.run]
key = "enter"
label = "Run"
type = "navigate"

[views.default.commands.run.payload]
target = "sys:output"
query = "{{ runtime:view.active.selected_item.text }}"

[views.output.engine]
type = "capture"

[views.output.engine.config]
output = '{{ script("scripts/run.sh", runtime:view.active.input) }}'
title = "{{ runtime:view.active.ref }}"
