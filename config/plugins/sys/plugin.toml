[plugin]
api = 1
name = "system"

[views.default]
type = "picker"
alias = "sys"
items = '{{ script("scripts/items.sh", runtime:view.active.query) }}'

[views.default.commands.run]
key = "enter"
label = "Run"
view = "sys:output"
input = "{{ runtime:view.active.selected_item.text }}"

[views.output]
type = "capture"
output = '{{ script("scripts/run.sh", runtime:view.active.input) }}'
title = "{{ runtime:view.active.ref }}"
