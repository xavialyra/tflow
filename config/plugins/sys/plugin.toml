[plugin]
api = 2

[views.default]
type = "launcher"
display_prefix = "sys"
items = '{{ script("scripts/items.sh", runtime:view.current.query) }}'

[views.default.commands.run]
key = "enter"
label = "Run"
view = "sys:output"
input = "{{ runtime:view.current.selected_item.text }}"

[views.output]
type = "capture"
output = '{{ script("scripts/run.sh", runtime:view.current.input) }}'
title = "{{ runtime:view.current.ref }}"
