[plugin]
api = 1
name = "applications"

[views.default]
alias = "app"

[views.default.engine]
type = "picker"

[views.default.engine.config]
items = '{{ script("scripts/items.sh", this:query) }}'

[views.default.commands.open]
key = "enter"
label = "Open"
type = "run"

[views.default.commands.open.payload]
handler = { file = "scripts/open.sh" }
