[plugin]
api = 1
name = "core"

[views.default]
alias = "core"

[views.default.engine]
type = "picker"

[views.default.engine.config]
show_prefix = true

[[views.default.engine.config.feeds]]
view = "sys:default"

[[views.default.engine.config.feeds]]
view = "shell:menu"

[[views.default.engine.config.feeds]]
view = "trans:default"

[[views.default.engine.config.feeds]]
view = "apps:default"

[views.messages]
alias = "log"

[views.messages.engine]
type = "picker"

[views.messages.engine.config]
items = '{{ script("scripts/items.sh", {query = this:query, log_file = runtime:view.current.log_file}) }}'

[views.command.engine]
type = "picker"

[views.command.engine.config]
