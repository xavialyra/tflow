[plugin]
api = 1

[views.default]
type = "launcher"
sources = ["sys:default", "shell:menu", "trans:default", "apps:default"]

[views.dmenu]
type = "launcher"
display = "text"

[views.messages]
type = "launcher"
display = "text"
display_prefix = "log"
items = '{{ script("scripts/items.sh", runtime:view.current) }}'

[views.command]
type = "launcher"
display = "text"
