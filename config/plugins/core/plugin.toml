[views.default]
type = "launcher"
sources = ["sys:default", "shell:default", "trans:default", "apps:default"]

[views.dmenu]
type = "launcher"
display = "text"

[views.messages]
type = "launcher"
display = "text"
display_prefix = "log"
filter = true
items = '{{ script("scripts/items.sh", runtime:view.current.log_file) }}'

[views.command]
type = "launcher"
display = "text"

[views.capture]
type = "capture"

[views.embedded]
type = "embedded"
