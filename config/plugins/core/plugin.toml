[plugin]
api = 1
name = "core"

[views.default]
type = "picker"
alias = "core"
show_prefix = true
sources = ["sys:default", "shell:menu", "trans:default", "apps:default"]

[views.messages]
type = "picker"
alias = "log"
items = '{{ script("scripts/items.sh", runtime:view.active) }}'

[views.command]
type = "picker"
