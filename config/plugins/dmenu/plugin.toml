[plugin]
api = 1
name = "dmenu"

[views.default]
alias = "dmenu"
cancel_exit_code = 1

[views.default.engine]
type = "picker"

[views.default.engine.config]
items = '''{{ script("scripts/items.sh", {input = input:$, query = this:query}, 67108864) }}'''
prompt = '''{{ this:query.prompt }}'''
show_prefix = false

[views.default.query]
type = "object"
input_order = ["initial"]
prompt = { type = "string", nullable = true }
initial = { type = "string", default = "" }
dmenu0 = { type = "boolean", default = false }
index = { type = "boolean", default = false }
with-nth = { type = "string", nullable = true }
accept-nth = { type = "string", nullable = true }
match-nth = { type = "string", nullable = true }
nth-delimiter = { type = "string", nullable = true }

[views.default.engine.config.bindings]
open_commands = []
open_completion = []
back = []
exit = ["escape", "ctrl+c", "ctrl+d"]

[views.default.commands.accept]
key = "enter"
label = "Accept"
type = "complete"

[views.default.commands.accept.payload]
handler = "scripts/result.sh"

[views.default.commands.accept.payload.params]
options = "{{ this:query }}"
stdin = "{{ input:stdin }}"
selected = "{{ runtime:view.active.selected_item }}"
typed = "{{ runtime:view.active.input }}"
