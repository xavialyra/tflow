[views.main.engine.config.items.handler]
script = '''#!/usr/bin/env python3
import json
import os
import shutil
import sys
import urllib.request

DEFAULT_CANDIDATES = [
    {
        "id": "calculator",
        "name": "Quick Calculator",
        "desc": "Real-time math evaluation with formatted display & clipboard copy.",
        "feed": "calculator:main",
        "aliases": {"calc": "calculator:main"},
        "deps": {"optional": ["wl-copy", "xclip"]}
    },
    {
        "id": "apps",
        "name": "Desktop Applications",
        "desc": "Search and launch GUI / desktop apps with icon preview & weight stats.",
        "feed": "apps:main",
        "aliases": {"app": "apps:main"},
        "deps": {"optional": ["gio", "setsid"]}
    },
    {
        "id": "sys",
        "name": "System & Session Controls",
        "desc": "Fast system actions for logging out, restarting, or shutting down.",
        "feed": "sys:main",
        "aliases": {"sys": "sys:main"},
        "deps": {"optional": ["systemctl", "loginctl"]}
    },
    {
        "id": "clipboard",
        "name": "Clipboard History",
        "desc": "Search, preview, and restore clipboard history entries.",
        "aliases": {"clip": "clipboard:default"},
        "deps": {"optional": ["wl-paste", "wl-copy", "xclip"]}
    },
    {
        "id": "shell",
        "name": "Shell Runner",
        "desc": "Quick interactive shell commands running in an embedded terminal.",
        "aliases": {"shell": "shell:main"},
        "deps": {"required": ["sh"]}
    },
    {
        "id": "dmenu",
        "name": "dmenu Emulation",
        "desc": "CLI pipeline filter compatible with dmenu scripts and keybindings.",
        "aliases": {"dmenu": "dmenu:main"},
        "deps": {}
    }
]

def workflow_cache_dir():
    cache_home = os.environ.get("XDG_CACHE_HOME") or os.path.expanduser("~/.cache")
    return os.path.join(cache_home, "tflow", "workflows")

def package_names(root):
    if not os.path.isdir(root):
        return []
    return sorted(
        name for name in os.listdir(root)
        if os.path.isfile(os.path.join(root, name, "workflow.toml"))
    )

def has_workflows(root):
    return bool(package_names(root))

def workflow_source_dir():
    """Directory holding the workflow packages, or None.

    Only the explicit `TFLOW_WORKFLOWS_BOOTSTRAP_DIR` override is read; it is a
    debug helper. A git source will be added here later, and the tree is never
    searched implicitly.
    """
    candidate = os.environ.get("TFLOW_WORKFLOWS_BOOTSTRAP_DIR")
    if candidate and has_workflows(candidate):
        return os.path.realpath(candidate)
    return None

def source_signature(source):
    """Fingerprint the source tree; any edit or added package changes it."""
    newest = 0.0
    files = 0
    for package in package_names(source):
        for root, dirs, names in os.walk(os.path.join(source, package)):
            dirs[:] = [name for name in dirs if name != "__pycache__"]
            for name in names:
                files += 1
                try:
                    newest = max(newest, os.path.getmtime(os.path.join(root, name)))
                except OSError:
                    pass
    return f"{os.path.realpath(source)}|{int(newest)}|{files}|{','.join(package_names(source))}"

def ensure_workflow_cache():
    """Return the cache, re-copying the source whenever the source changed.

    The marker records the source fingerprint, so editing the workflow source
    refreshes the cache on the next run. With no source configured this returns
    None rather than trusting whatever the cache happens to hold.
    """
    cache = workflow_cache_dir()
    source = workflow_source_dir()
    if source is None:
        return None

    signature = source_signature(source)
    marker = os.path.join(cache, ".bootstrap-source")
    if has_workflows(cache):
        try:
            with open(marker, encoding="utf-8") as f:
                if f.read().strip() == signature:
                    return cache
        except OSError:
            pass

    os.makedirs(os.path.dirname(cache), exist_ok=True)
    staging = f"{cache}.staging-{os.getpid()}"
    shutil.rmtree(staging, ignore_errors=True)
    try:
        shutil.copytree(
            source,
            staging,
            ignore=shutil.ignore_patterns("__pycache__", "*.pyc", ".bootstrap-*"),
        )
        if not has_workflows(staging):
            return None
        with open(os.path.join(staging, ".bootstrap-source"), "w", encoding="utf-8") as f:
            f.write(signature + "\n")
        shutil.rmtree(cache, ignore_errors=True)
        os.replace(staging, cache)
    finally:
        shutil.rmtree(staging, ignore_errors=True)
    return cache if has_workflows(cache) else None

def fetch_catalog():
    ensure_workflow_cache()
    return DEFAULT_CANDIDATES

def main():
    try:
        raw_input = sys.stdin.read()
        request = json.loads(raw_input) if raw_input.strip() else {}
    except Exception:
        request = {}

    context = request.get("context", {})
    parameters = context.get("parameters", {})
    selected = set(parameters.get("selected", []))

    engine = context.get("engine", {})
    state = engine.get("state", {}) if isinstance(engine, dict) else {}
    query = state.get("input", "") if isinstance(state, dict) else ""
    tokens = query.casefold().split()

    catalog = fetch_catalog()
    cache = ensure_workflow_cache()
    items = []
    for c in catalog:
        cid = c["id"]
        workflow_dir = (
            os.path.join(cache, cid)
            if cache and os.path.isfile(os.path.join(cache, cid, "workflow.toml"))
            else None
        )
        if workflow_dir is None:
            continue
        name = c.get("name", cid)
        desc = c.get("desc") or c.get("description", "")
        searchable = f"{cid} {name} {desc}".casefold()
        if not all(token in searchable for token in tokens):
            continue

        is_sel = cid in selected
        mark = "[✓] " if is_sel else "[ ] "

        display = {
            "constraints": [{"Length": 4}, {"Fill": 1}],
            "cells": [
                {"text": mark, "slot": "checked" if is_sel else "unchecked"},
                {"text": f"{name} ({cid})", "slot": "checked" if is_sel else "primary"},
            ],
        }

        items.append({
            "value": cid,
            "display": display,
            "metadata": {
                "id": cid,
                "name": name,
                "desc": desc,
                "deps": c.get("deps", {}),
                "aliases": c.get("aliases", {}),
                "feed": c.get("feed"),
                "selected": is_sel,
                "workflow_dir": workflow_dir,
            },
        })

    if not items and cache is None:
        items.append({
            "display": "No workflow source found: set TFLOW_WORKFLOWS_BOOTSTRAP_DIR to the directory that holds the workflow packages.",
            "value": "",
            "metadata": {
                "id": "",
                "name": "No workflow source",
                "desc": "",
                "deps": {},
                "aliases": {},
                "feed": None,
                "selected": False,
                "workflow_dir": None,
            },
        })

    json.dump({"version": 1, "items": items}, sys.stdout, separators=(",", ":"))
    sys.stdout.write("\n")

if __name__ == "__main__":
    main()
'''

