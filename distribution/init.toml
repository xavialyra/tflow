[commands.install.handler]
script = '''#!/usr/bin/env python3
import json
import os
import shutil
import sys

DEFAULT_CANDIDATES = [
    {
        "id": "calculator",
        "name": "Quick Calculator",
        "feed": "calculator:main",
        "aliases": {"calc": "calculator:main"},
    },
    {
        "id": "apps",
        "name": "Desktop Applications",
        "feed": "apps:main",
        "aliases": {"app": "apps:main"},
    },
    {
        "id": "sys",
        "name": "System & Session Controls",
        "feed": "sys:main",
        "aliases": {"sys": "sys:main"},
    },
    {
        "id": "clipboard",
        "name": "Clipboard History",
        "aliases": {"clip": "clipboard:default"},
    },
    {
        "id": "shell",
        "name": "Shell Runner",
        "aliases": {"shell": "shell:main"},
    },
    {
        "id": "dmenu",
        "name": "dmenu Emulation",
        "aliases": {"dmenu": "dmenu:main"},
    }
]

def fetch_catalog():
    return DEFAULT_CANDIDATES

def resolve_target_dirs():
    xdg_config = os.environ.get("XDG_CONFIG_HOME")
    if xdg_config:
        config_dir = os.path.join(xdg_config, "tlaunch")
    else:
        home = os.environ.get("HOME", os.path.expanduser("~"))
        config_dir = os.path.join(home, ".config", "tlaunch")
    return config_dir

def workflow_cache_dir():
    cache_home = os.environ.get("XDG_CACHE_HOME") or os.path.expanduser("~/.cache")
    return os.path.join(cache_home, "tlaunch", "workflows")

def generate_suite_manifest(selected):
    catalog = fetch_catalog()
    catalog_map = {c["id"]: c for c in catalog}

    feeds = []
    for wf in selected:
        info = catalog_map.get(wf, {})
        feed = info.get("feed")
        if feed:
            feeds.append(f'    "{feed}",')

    feeds_toml = "\n".join(feeds)
    if feeds_toml:
        feeds_toml = f"\n  sources = [\n{feeds_toml}\n  ]"

    wf_lines = [f'{wf} = {{ dir = "./workflows/{wf}" }}' for wf in selected]
    wf_toml = "\n".join(wf_lines)

    alias_lines = []
    for wf in selected:
        info = catalog_map.get(wf, {})
        aliases = info.get("aliases", {})
        for a_k, a_v in aliases.items():
            alias_lines.append(f'{a_k} = "{a_v}"')
    alias_toml = "\n".join(alias_lines)

    return f"""[suite]
api = 1
name = "Default Suite"

[suite.entrypoint]
target = "core:main"
query = {{{feeds_toml}
}}

[workflows]
core = {{ dir = "./workflows/core" }}
{wf_toml}

[aliases]
{alias_toml}
"""

def generate_settings_manifest():
    return """# Passive host settings for tlaunch
[defaults.picker.bindings]
exit = ["ctrl+c", "ctrl+d"]
toggle_preview = ["ctrl+p"]
back = ["escape"]
select_previous = ["up"]
select_next = ["down"]
"""

def main():
    try:
        raw_input = sys.stdin.read()
        request = json.loads(raw_input) if raw_input.strip() else {}
    except Exception:
        request = {}

    context = request.get("context", {})
    parameters = context.get("parameters", {})
    selected = list(parameters.get("selected", []))

    config_dir = resolve_target_dirs()
    workflows_dir = os.path.join(config_dir, "workflows")
    os.makedirs(workflows_dir, exist_ok=True)

    cache_root = workflow_cache_dir()
    installed = []

    to_copy = list(selected)
    if "core" not in to_copy:
        to_copy.append("core")

    for wf in to_copy:
        wf_src = os.path.join(cache_root, wf)
        if os.path.isdir(wf_src):
            dst = os.path.join(workflows_dir, wf)
            shutil.copytree(wf_src, dst, dirs_exist_ok=True)
            installed.append(wf)

    suite_file = os.path.join(config_dir, "default.toml")
    settings_file = os.path.join(config_dir, "settings.toml")

    with open(suite_file, "w", encoding="utf-8") as f:
        f.write(generate_suite_manifest(selected))

    if not os.path.exists(settings_file):
        with open(settings_file, "w", encoding="utf-8") as f:
            f.write(generate_settings_manifest())

    installed_str = ", ".join(installed) if installed else "(none)"
    msg = f"""
\033[1;32m🎉 [✓] tlaunch configuration installed successfully!\033[0m
============================================================
  Suite Manifest:   {suite_file}
  Settings File:    {settings_file}
  Workflows Dir:    {workflows_dir}
  Active Workflows: {installed_str}
============================================================

You are ready to launch! Try running:
  \033[1;36mtlaunch\033[0m               # Open unified launcher (core)
  \033[1;36mtlaunch app\033[0m           # Search & launch applications
  \033[1;36mtlaunch calc\033[0m          # Quick math calculator
  \033[1;36mtlaunch sys\033[0m           # Power and session menu
"""

    json.dump(
        {
            "version": 1,
            "operation": {
                "type": "run",
                "mode": "foreground",
                "argv": [sys.executable, "-c", "import sys; print(sys.argv[1])", msg],
                "exit": True,
            },
        },
        sys.stdout,
        separators=(",", ":"),
    )
    sys.stdout.write("\n")

if __name__ == "__main__":
    main()
'''

