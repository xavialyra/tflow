script = '''#!/usr/bin/env python3
import json
import os
import shutil
import subprocess
import sys
import tempfile

def resolve_tflow_bin():
    if os.environ.get("TFLOW_BIN"):
        return os.environ["TFLOW_BIN"]
    which = shutil.which("tflow")
    return which if which else "tflow"

def generate_settings_content():
    return """[defaults.picker.bindings]
exit = ["ctrl+c", "ctrl+d"]
toggle_preview = ["ctrl+p"]
back = ["escape"]
select_previous = ["up"]
select_next = ["down"]
"""

def main():
    try:
        raw_input = sys.stdin.read()
        request = json.loads(raw_input) if raw_input.strip() else {}
    except Exception:
        request = {}

    context = request.get("context", {})
    parameters = context.get("parameters", {})
    selected = list(parameters.get("selected", []))
    engine = context.get("engine", {})
    state = engine.get("state", {}) if isinstance(engine, dict) else {}
    item = state.get("item", {}) if isinstance(state, dict) else {}
    current = item.get("value") if isinstance(item, dict) else None

    meta = item.get("metadata", {}) if isinstance(item, dict) else {}
    workflow_id = meta.get("id") or (item.get("value") if isinstance(item, dict) else None)
    workflow_source = meta.get("workflow_dir")
    if not workflow_id or not workflow_source:
        print("Selected workflow is not available in the cache.", file=sys.stderr)
        sys.exit(1)

    tflow_bin = resolve_tflow_bin()

    runner_script = f"""
import os, sys, shutil, tempfile, subprocess

workflow_id = {json.dumps(workflow_id)}
workflow_source = {json.dumps(workflow_source)}
tflow_bin = {json.dumps(tflow_bin)}

if not workflow_source or not os.path.isdir(workflow_source):
    raise SystemExit(f"cached workflow is not available for {workflow_id!r}")

tmpdir = tempfile.mkdtemp(prefix="tflow-sandbox-")
try:
    workflow_dir = os.path.join(tmpdir, workflow_id)
    shutil.copytree(workflow_source, workflow_dir)

    settings_path = os.path.join(tmpdir, "settings.toml")
    with open(settings_path, "w", encoding="utf-8") as f:
        f.write({json.dumps(generate_settings_content())})

    print(f"\\n\\033[1;33m>>> Trying workflow: {workflow_id} (zero-side-effect sandbox)\\033[0m")
    env = os.environ.copy()
    env["TFLOW_SETTINGS"] = settings_path
    subprocess.run([tflow_bin, "-w", workflow_dir, "-c", settings_path], env=env)
finally:
    shutil.rmtree(tmpdir, ignore_errors=True)
    print("\\033[1;32m[✓] Cleaned sandbox environment. Zero files were touched.\\033[0m\\n")
"""

    json.dump(
        {
            "version": 1,
            "operation": {
                "type": "run",
                "mode": "foreground",
                "argv": [sys.executable, "-c", runner_script],
                "exit": False,
            },
        },
        sys.stdout,
        separators=(",", ":"),
    )
    sys.stdout.write("\n")

if __name__ == "__main__":
    main()
'''

