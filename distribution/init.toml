[views.main.engine.config.preview.handler]
script = '''#!/usr/bin/env python3
import json
import os
import shutil
import sys

def check_command(cmd):
    return shutil.which(cmd) is not None

def generate_suite_preview(selected):
    feeds = []
    if "calculator" in selected:
        feeds.append('    "calculator:main",')
    if "apps" in selected:
        feeds.append('    "apps:main",')
    if "sys" in selected:
        feeds.append('    "sys:main",')

    feeds_toml = "\n".join(feeds)
    if feeds_toml:
        feeds_toml = f"\n  sources = [\n{feeds_toml}\n  ]"

    wf_blocks = []
    for wf in selected:
        wf_blocks.append(f'{wf} = {{ dir = "./workflows/{wf}" }}')
    wf_toml = "\n".join(wf_blocks)

    alias_map = {
        "apps": 'app = "apps:main"',
        "calculator": 'calc = "calculator:main"',
        "sys": 'sys = "sys:main"',
        "clipboard": 'clip = "clipboard:default"',
        "shell": 'shell = "shell:main"',
        "dmenu": 'dmenu = "dmenu:main"',
    }
    alias_blocks = [alias_map[wf] for wf in selected if wf in alias_map]
    alias_toml = "\n".join(alias_blocks)

    return f"""[suite]
api = 1
name = "My Workspace"

[suite.entrypoint]
target = "core:main"
query = {{{feeds_toml}
}}

[workflows]
core = {{ dir = "./workflows/core" }}
{wf_toml}

[aliases]
{alias_toml}"""

def main():
    try:
        raw_input = sys.stdin.read()
        request = json.loads(raw_input) if raw_input.strip() else {}
    except Exception:
        request = {}

    context = request.get("context", {})
    parameters = context.get("parameters", {})
    selected = parameters.get("selected", [])

    engine = context.get("engine", {})
    state = engine.get("state", {}) if isinstance(engine, dict) else {}
    item = state.get("item")

    children = []

    # 1. Current Highlighted Item Card
    if isinstance(item, dict):
        meta = item.get("metadata", {})
        cid = meta.get("id", item.get("value", ""))
        name = meta.get("name", cid)
        desc = meta.get("desc", "")
        is_sel = meta.get("selected", False)
        deps = meta.get("deps", {})

        spans = [
            {"text": f"{desc}\n\n"},
            {"text": "System Doctor Check:\n"}
        ]

        # Check required dependencies
        reqs = deps.get("required", [])
        opts = deps.get("optional", [])
        if not reqs and not opts:
            spans.append({"text": "  ✓ Pure standard environment (zero external dependencies)\n"})
        else:
            for req in reqs:
                ok = check_command(req)
                spans.append({
                    "text": f"  {'✓' if ok else '✗'} {req:<12} (required)  -> {'found' if ok else 'NOT FOUND'}\n"
                })
            for opt in opts:
                ok = check_command(opt)
                spans.append({
                    "text": f"  {'✓' if ok else '○'} {opt:<12} (optional)  -> {'available' if ok else 'not installed'}\n"
                })

        children.append({
            "type": "paragraph",
            "spans": spans,
            "title": f" Component Inspector: {cid} ",
            "border": True,
        })
    else:
        children.append({
            "type": "paragraph",
            "text": "Move cursor to inspect components...",
            "title": " Component Inspector ",
            "border": True,
        })

    # 2. Actions & Keymap Banner
    actions_text = (
        "Keybindings & Fast Actions:\n"
        "  • [Tab]         Toggle selected workflow\n"
        "  • [Ctrl+T]      Try Now! (Zero-side-effect sandbox session)\n"
        "  • [Enter]       Install to ~/.config/tlaunch (Writes Suite & Settings)\n"
        "  • [Ctrl+A/R]    Select All / Clear All\n"
        "  • [Esc]         Exit Setup Wizard"
    )
    children.append({
        "type": "paragraph",
        "text": actions_text,
        "title": " Ready Actions ",
        "border": True,
    })

    doc = {
        "version": 1,
        "preview": {
            "type": "layout",
            "direction": "vertical",
            "constraints": [{"Fill": 1}, {"Length": 8}],
            "children": children,
        },
    }

    json.dump(doc, sys.stdout, separators=(",", ":"))
    sys.stdout.write("\n")

if __name__ == "__main__":
    main()
'''

