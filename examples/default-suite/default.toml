[suite]
api = 1
name = "Default Example Suite"

[suite.entrypoint]
target = "core:main"

[suite.entrypoint.query]
sources = [
  "calculator:main",
  "apps:main",
  "sys:main",
]

[workflows]
core = { dir = "./workflows/core" }
calculator = { dir = "./workflows/calculator" }
apps = { dir = "./workflows/apps" }
sys = { dir = "./workflows/sys" }
clipboard = { dir = "./workflows/clipboard" }
shell = { dir = "./workflows/shell" }
dmenu = { dir = "./workflows/dmenu" }

[host.bindings]
"ctrl+k" = "__commands.palette"
"ctrl+g" = "__parameters.edit"

