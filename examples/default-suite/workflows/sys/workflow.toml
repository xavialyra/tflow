[workflow]
api = 1
name = "sys"

[views.main]
engine = "picker"

[views.main.picker.items]
file = "scripts/items.py"

[views.main.picker.preview]
file = "scripts/preview.py"
width = "40%"
min_width = 24
open = false

[views.main.bindings]
enter = "run"

[commands.run]
label = "Run"
type = "navigate"
producer = "script"
[commands.run.handler]
file = "scripts/command.py"

[views.confirm]
engine = "picker"
[views.confirm.query]
type = "object"
input = "action"
action = { type = "string", default = "" }

[views.confirm.picker]
show_input = false
show_left_prefix = false

[views.confirm.picker.items]
file = "scripts/confirm_items.py"

[views.confirm.bindings]
enter = "confirm_exec"

[commands.confirm_exec]
label = "Confirm"
type = "navigate"
producer = "script"
[commands.confirm_exec.handler]
file = "scripts/confirm_exec.py"

[views.output]
engine = "capture"

[views.output.capture.output]
file = "scripts/run.py"
