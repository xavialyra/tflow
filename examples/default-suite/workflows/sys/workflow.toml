[workflow]
api = 1
name = "sys"

[views.main]

[views.main.preview]
file = "scripts/preview.py"
width = "40%"
min_width = 24
open = false

[views.main.engine]
type = "picker"

[views.main.engine.config.items]
producer = "script"
[views.main.engine.config.items.handler]
file = "scripts/items.py"

[views.main.bindings]
enter = "run"

[commands.run]
label = "Run"
type = "navigate"
producer = "script"
[commands.run.handler]
file = "scripts/command.py"

[views.confirm]
[views.confirm.query]
type = "object"
input = "action"
action = { type = "string", default = "" }

[views.confirm.engine]
type = "picker"

[views.confirm.engine.config]
show_input = false
show_left_prefix = false

[views.confirm.engine.config.items]
producer = "script"
[views.confirm.engine.config.items.handler]
file = "scripts/confirm_items.py"

[views.confirm.bindings]
enter = "confirm_exec"

[commands.confirm_exec]
label = "Confirm"
type = "navigate"
producer = "script"
[commands.confirm_exec.handler]
file = "scripts/confirm_exec.py"

[views.output.engine]
type = "capture"

[views.output.engine.config.output]
producer = "script"
[views.output.engine.config.output.handler]
file = "scripts/run.py"
