[workflow]
api = 1
name = "Clipboard History"

[styles.history_icon]
foreground = "scheme:accent"
bold = true

[styles.history_icon.selected]
foreground = "scheme:accent"
bold = true

[views.main]
engine = "picker"
companion = "preview"

[views.main.query]
type = "object"
input = "search"
search = { type = "string", default = "" }
content_type = { type = "enum", options = ["all", "text", "image", "binary"], default = "all" }

[views.main.picker]
input_placeholder = "Search clipboard history"

[views.main.picker.items]
file = "scripts/items.py"

[views.preview]
engine = "capture"

[views.preview.query]
type = "object"
item = { type = "object", default = {} }

[views.preview.capture.output]
file = "scripts/preview.py"

[views.main.bindings]
"ctrl+p" = "preview"
tab = "next_type"
"shift+tab" = "previous_type"
enter = "copy"

[commands.previous_type]
label = "Previous content type"
type = "navigate"
file = "scripts/cycle-type.py"

[commands.next_type]
label = "Next content type"
type = "navigate"
file = "scripts/cycle-type.py"

[commands.copy]
label = "Copy"
type = "run"
file = "scripts/restore.py"

[commands.preview]
label = "Toggle Companion"
type = "companion"
target = "preview"
args = { item = "$selection" }
