[workflow]
api = 1
name = "Clipboard History"

[styles.history_icon]
foreground = "scheme:accent"
bold = true

[styles.history_icon.selected]
foreground = "scheme:accent"
bold = true

[views.main]
engine = "picker"

[views.main.query]
type = "object"
input = "search"
search = { type = "string", default = "" }
content_type = { type = "enum", options = ["all", "text", "image", "binary"], default = "all" }

[views.main.picker]
input_placeholder = "Search clipboard history"

[views.main.picker.items]
file = "scripts/items.py"

[views.main.picker.preview]
file = "scripts/preview.py"
width = "35%"
min_width = 24
open = true

[views.main.bindings]
tab = "next_type"
"shift+tab" = "previous_type"
enter = "copy"

[commands.previous_type]
label = "Previous content type"
type = "navigate"
producer = "script"
[commands.previous_type.handler]
file = "scripts/cycle-type.py"

[commands.next_type]
label = "Next content type"
type = "navigate"
producer = "script"
[commands.next_type.handler]
file = "scripts/cycle-type.py"

[commands.copy]
label = "Copy"
type = "run"
producer = "script"
[commands.copy.handler]
file = "scripts/restore.py"
