[workflow]
api = 1
name = "Clipboard History"
entrypoint = "default"

[styles.history_icon]
foreground = "scheme:accent"
bold = true

[styles.history_icon.selected]
foreground = "scheme:accent"
bold = true

[views.default]

[views.default.query]
type = "object"
input = "search"
search = { type = "string", default = "" }
content_type = { type = "enum", options = ["all", "text", "image", "binary"], default = "all" }

[views.default.engine]
type = "picker"

[views.default.engine.config]
input_placeholder = "Search clipboard history"
preview_ratio = 0.35
preview_min_width = 24
preview_default_open = true

[views.default.engine.config.items]
producer = "script"

[views.default.engine.config.items.handler]
file = "scripts/items.py"

[views.default.engine.config.preview]
producer = "script"
[views.default.engine.config.preview.handler]
file = "scripts/preview.py"

[views.default.bindings]
"escape" = "@engine:picker.back"
"ctrl+p" = "@engine:picker.toggle_preview"
tab = "next_type"
"shift+tab" = "previous_type"
enter = "copy"

[commands.previous_type]
label = "Previous content type"
type = "navigate"
producer = "script"
[commands.previous_type.handler]
file = "scripts/cycle-type.py"

[commands.next_type]
label = "Next content type"
type = "navigate"
producer = "script"
[commands.next_type.handler]
file = "scripts/cycle-type.py"

[commands.copy]
label = "Copy"
type = "run"
producer = "script"
[commands.copy.handler]
file = "scripts/restore.py"
