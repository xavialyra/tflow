[workflow]
api = 1
name = "calculator"

[views.main]
engine = "picker"

[views.main.picker.items]
file = "scripts/items.py"

[views.main.picker.preview]
file = "scripts/preview.py"
width = "38%"
min_width = 24
open = false

[views.main.bindings]
enter = "copy"

[commands.copy]
label = "Copy result"
type = "run"
producer = "script"

[commands.copy.handler]
file = "scripts/copy.py"
