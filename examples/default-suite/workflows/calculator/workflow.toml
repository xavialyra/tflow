[workflow]
api = 1
name = "calculator"

[views.main]
engine = "picker"
companion = "preview"
companion_size = ["40%", "35%"]

[views.main.picker.items]
file = "scripts/items.py"

[views.preview]
engine = "capture"

[views.preview.query]
type = "object"
item = { type = "object", default = {} }

[views.preview.capture.output]
file = "scripts/preview.py"

[views.main.bindings]
"ctrl+p" = "preview"
enter = "copy"

[commands.copy]
label = "Copy result"
type = "run"
file = "scripts/copy.py"

[commands.preview]
label = "Toggle Preview"
type = "companion"
target = "preview"
args = { item = "$selection" }
