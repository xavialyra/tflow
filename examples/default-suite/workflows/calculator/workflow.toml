[workflow]
api = 1
name = "calculator"

[views.main]
engine = "picker"
companion = "preview"

[views.main.companions.preview]
target = "preview"
args = { item = "$selection" }

[views.main.picker.items]
file = "scripts/items.py"

[views.preview]
engine = "capture"

[views.preview.query]
type = "object"
item = { type = "object", default = {} }

[views.preview.capture.output]
file = "scripts/preview.py"

[views.main.bindings]
"ctrl+p" = "toggle_companion"
enter = "copy"

[commands.copy]
label = "Copy result"
type = "run"
file = "scripts/copy.py"

[commands.toggle_companion]
label = "Toggle Companion"
companion = "preview"
