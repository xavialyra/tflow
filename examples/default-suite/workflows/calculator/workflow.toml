[workflow]
api = 1
name = "calculator"
entrypoint = "main"

[views.main]

[views.main.engine]
type = "picker"

[views.main.engine.config]
preview_ratio = 0.38
preview_min_width = 24
preview_default_open = false

[views.main.engine.config.items]
producer = "script"
[views.main.engine.config.items.handler]
file = "scripts/items.py"

[views.main.engine.config.preview]
producer = "script"
[views.main.engine.config.preview.handler]
file = "scripts/preview.py"

[views.main.keymap]
enter = "copy"

[commands.copy]
label = "Copy result"
type = "run"
producer = "script"

[commands.copy.handler]
file = "scripts/copy.py"
