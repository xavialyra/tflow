[workflow]
api = 1
name = "calculator"

[views.main]

[views.main.preview]
file = "scripts/preview.py"
width = "38%"
min_width = 24
open = false

[views.main.engine]
type = "picker"

[views.main.engine.config.items]
producer = "script"
[views.main.engine.config.items.handler]
file = "scripts/items.py"

[views.main.bindings]
enter = "copy"

[commands.copy]
label = "Copy result"
type = "run"
producer = "script"

[commands.copy.handler]
file = "scripts/copy.py"
