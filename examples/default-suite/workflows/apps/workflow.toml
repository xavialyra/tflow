[workflow]
api = 1
name = "applications"

[views.main]
engine = "picker"

[views.main.picker]
input_placeholder = "Search applications"

[views.main.picker.items]
file = "scripts/apps.py"

[views.main.picker.preview]
file = "scripts/preview.py"
width = "35%"
min_width = 24
open = false

[views.main.bindings]
enter = "open"
"ctrl+o" = "open_detached"
"ctrl+w" = "weight"
"ctrl+y" = "copy_path"

[views.weight]
engine = "form"
[views.weight.query]
type = "object"
input = "app"
app = { type = "string", default = "" }

[views.weight.form.content]
file = "scripts/weight-content.py"

[views.weight.bindings]
enter = "save"

[commands.open]
label = "Open"
type = "run"
file = "scripts/open.py"

# Same launcher as `open`, without waiting for the activation call to return.
[commands.open_detached]
label = "Open detached"
type = "run"
file = "scripts/open.py"

[commands.weight]
label = "Set weight"
type = "call"
file = "scripts/weight-popup.py"

[commands.copy_path]
label = "Copy path"
type = "run"
file = "scripts/copy-path.py"

[commands.save]
label = "Save"
type = "return"
file = "scripts/set-weight.py"
