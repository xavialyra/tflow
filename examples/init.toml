script = '''#!/usr/bin/env python3
import json
import os
import shutil
import sys

def check_command(cmd):
    return shutil.which(cmd) is not None

def main():
    try:
        raw_input = sys.stdin.read()
        request = json.loads(raw_input) if raw_input.strip() else {}
    except Exception:
        request = {}

    context = request.get("context", {})
    parameters = context.get("parameters", {})
    if isinstance(parameters, str):
        try:
            parameters = json.loads(parameters)
        except Exception:
            parameters = {}
    selected = parameters.get("selected", [])
    item = parameters.get("item")
    if not isinstance(item, dict):
        engine = context.get("engine", {})
        state = engine.get("state", {}) if isinstance(engine, dict) else {}
        item = state.get("item")

    children = []

    # 1. Current Highlighted Item Card
    if isinstance(item, dict):
        meta = item.get("metadata", {})
        cid = meta.get("id", item.get("value", ""))
        name = meta.get("name", cid)
        desc = meta.get("desc", "")
        is_sel = meta.get("selected", False)
        deps = meta.get("deps", {})

        spans = [
            {"text": f"{desc}\n\n"},
            {"text": "System Doctor Check:\n"}
        ]

        # Check required dependencies
        reqs = deps.get("required", [])
        opts = deps.get("optional", [])
        if not reqs and not opts:
            spans.append({"text": "  ✓ Pure standard environment (zero external dependencies)\n"})
        else:
            for req in reqs:
                ok = check_command(req)
                spans.append({
                    "text": f"  {'✓' if ok else '✗'} {req:<12} (required)  -> {'found' if ok else 'NOT FOUND'}\n"
                })
            for opt in opts:
                ok = check_command(opt)
                spans.append({
                    "text": f"  {'✓' if ok else '○'} {opt:<12} (optional)  -> {'available' if ok else 'not installed'}\n"
                })

        children.append({
            "type": "paragraph",
            "spans": spans,
            "title": f" Component Inspector: {cid} ",
            "border": True,
        })
    else:
        children.append({
            "type": "paragraph",
            "text": "Move cursor to inspect components...",
            "title": " Component Inspector ",
            "border": True,
        })

    # 2. Actions & Bindings Banner
    actions_text = (
        "Keybindings & Fast Actions:\n"
        "  • [Tab]         Toggle selected workflow\n"
        "  • [Ctrl+T]      Try Now! (Zero-side-effect sandbox session)\n"
        "  • [Enter]       Install to ~/.config/tflow (Writes Suite & Settings)\n"
        "  • [Ctrl+A/R]    Select All / Clear All\n"
        "  • [Esc]         Exit Setup Wizard"
    )
    children.append({
        "type": "paragraph",
        "text": actions_text,
        "title": " Ready Actions ",
        "border": True,
    })

    doc = {
        "version": 1,
        "preview": {
            "type": "layout",
            "direction": "vertical",
            "constraints": [{"Fill": 1}, {"Length": 8}],
            "children": children,
        },
    }

    json.dump(doc, sys.stdout, separators=(",", ":"))
    sys.stdout.write("\n")

if __name__ == "__main__":
    main()
'''

