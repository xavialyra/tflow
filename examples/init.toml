[views.main.picker.items]
script = '''#!/usr/bin/env python3
import atexit
import json
import os
import shutil
import tempfile
import subprocess
import sys
import urllib.request

DEFAULT_CANDIDATES = [
    {
        "id": "calculator",
        "name": "Quick Calculator",
        "desc": "Real-time math evaluation with formatted display & clipboard copy.",
        "feed": "calculator:main",
        "aliases": {"calc": "calculator:main"},
        "deps": {"optional": ["wl-copy", "xclip"]},
    },
    {
        "id": "apps",
        "name": "Desktop Applications",
        "desc": "Search and launch GUI / desktop apps with icon preview & weight stats.",
        "feed": "apps:main",
        "aliases": {"app": "apps:main"},
        "deps": {"optional": ["gio", "setsid"]},
    },
    {
        "id": "sys",
        "name": "System & Session Controls",
        "desc": "Fast system actions for locking screen, sleeping, restarting, or shutting down.",
        "feed": "sys:main",
        "deps": {"optional": ["systemctl", "loginctl"]},
    },
    {
        "id": "clipboard",
        "name": "Clipboard History",
        "desc": "Search, preview, and restore clipboard history entries.",
        "aliases": {"clip": "clipboard:main"},
        "deps": {"optional": ["wl-paste", "wl-copy", "xclip"]},
    },
    {
        "id": "shell",
        "name": "Shell Runner",
        "desc": "Quick interactive shell commands running in an embedded terminal.",
        "deps": {"required": ["sh"]},
    },
    {
        "id": "dmenu",
        "name": "dmenu Emulation",
        "desc": "CLI pipeline filter compatible with dmenu scripts and keybindings.",
        "deps": {},
    },
]

def package_names(root):
    if not os.path.isdir(root):
        return []
    return sorted(
        name for name in os.listdir(root)
        if os.path.isfile(os.path.join(root, name, "workflow.toml"))
    )

def has_workflows(root):
    return bool(package_names(root))

def is_pid_alive(pid):
    try:
        os.kill(pid, 0)
        return True
    except (ProcessLookupError, PermissionError):
        return False

def sweep_stale_session_dirs():
    """Remove orphaned session directories from previous dead launcher processes."""
    tmp_base = tempfile.gettempdir()
    prefix = "tflow-init-"
    try:
        for entry in os.listdir(tmp_base):
            if entry.startswith(prefix):
                pid_str = entry[len(prefix):]
                if pid_str.isdigit():
                    pid = int(pid_str)
                    if not is_pid_alive(pid):
                        shutil.rmtree(os.path.join(tmp_base, entry), ignore_errors=True)
    except OSError:
        pass

def workflow_source_dir():
    """Resolve workflow sources using local checkout or a session-scoped ephemeral cache."""
    env_dir = os.environ.get("TFLOW_WORKFLOWS_BOOTSTRAP_DIR")
    if env_dir and has_workflows(env_dir):
        return os.path.realpath(env_dir)

    candidate = os.path.join(os.getcwd(), "examples", "default-suite", "workflows")
    if has_workflows(candidate):
        return os.path.realpath(candidate)

    sweep_stale_session_dirs()

    session_id = os.getppid()
    cache_dir = os.path.join(tempfile.gettempdir(), f"tflow-init-{session_id}")
    cached_source = os.path.join(cache_dir, "examples", "default-suite", "workflows")
    if has_workflows(cached_source):
        return os.path.realpath(cached_source)

    os.makedirs(cache_dir, exist_ok=True)
    try:
        subprocess.run(
            ["git", "clone", "--depth", "1", "https://github.com/xavialyra/tflow.git", cache_dir],
            check=True,
            stdout=subprocess.DEVNULL,
            stderr=subprocess.DEVNULL,
        )
    except Exception:
        shutil.rmtree(cache_dir, ignore_errors=True)
        raise

    if not has_workflows(cached_source):
        shutil.rmtree(cache_dir, ignore_errors=True)
        raise RuntimeError("Cloned repository has no example workflows")
    return os.path.realpath(cached_source)

def ensure_workflow_cache():
    return workflow_source_dir()

def fetch_catalog():
    ensure_workflow_cache()
    return DEFAULT_CANDIDATES

def main():
    try:
        raw_input = sys.stdin.read()
        request = json.loads(raw_input) if raw_input.strip() else {}
    except Exception:
        request = {}

    context = request.get("context", {})
    parameters = context.get("parameters", {})
    selected = set(parameters.get("selected", []))

    engine = context.get("engine", {})
    state = engine.get("state", {}) if isinstance(engine, dict) else {}
    query = state.get("input", "") if isinstance(state, dict) else ""
    tokens = query.casefold().split()

    catalog = fetch_catalog()
    cache = ensure_workflow_cache()
    items = []
    for c in catalog:
        cid = c["id"]
        workflow_dir = (
            os.path.join(cache, cid)
            if cache and os.path.isfile(os.path.join(cache, cid, "workflow.toml"))
            else None
        )
        if workflow_dir is None:
            continue
        name = c.get("name", cid)
        desc = c.get("desc") or c.get("description", "")
        searchable = f"{cid} {name} {desc}".casefold()
        if not all(token in searchable for token in tokens):
            continue

        is_sel = cid in selected
        mark = "[✓] " if is_sel else "[ ] "

        display = {
            "constraints": [{"Length": 4}, {"Fill": 1}],
            "cells": [
                {"text": mark, "slot": "checked" if is_sel else "unchecked"},
                {"text": f"{name} ({cid})", "slot": "checked" if is_sel else "primary"},
            ],
        }

        items.append({
            "value": cid,
            "display": display,
            "metadata": {
                "id": cid,
                "name": name,
                "desc": desc,
                "deps": c.get("deps", {}),
                "aliases": c.get("aliases", {}),
                "feed": c.get("feed"),
                "selected": is_sel,
                "workflow_dir": workflow_dir,
            },
        })

    if not items and cache is None:
        items.append({
            "display": "No workflow source found: set TFLOW_WORKFLOWS_BOOTSTRAP_DIR to the example suite workflows directory.",
            "value": "",
            "metadata": {
                "id": "",
                "name": "No workflow source",
                "desc": "",
                "deps": {},
                "aliases": {},
                "feed": None,
                "selected": False,
                "workflow_dir": None,
            },
        })

    json.dump({"version": 1, "items": items}, sys.stdout, separators=(",", ":"))
    sys.stdout.write("\n")

if __name__ == "__main__":
    main()
'''

