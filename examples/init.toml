script = '''#!/usr/bin/env python3
import atexit
import json
import os
import shutil
import tempfile
import subprocess
import sys

DEFAULT_CANDIDATES = [
    {
        "id": "calculator",
        "name": "Quick Calculator",
        "feed": "calculator:main",
        "aliases": {"calc": "calculator:main"},
    },
    {
        "id": "apps",
        "name": "Desktop Applications",
        "feed": "apps:main",
        "aliases": {"app": "apps:main"},
    },
    {
        "id": "sys",
        "name": "System & Session Controls",
        "feed": "sys:main",
    },
    {
        "id": "clipboard",
        "name": "Clipboard History",
        "feed": "clipboard:main",
        "aliases": {"clip": "clipboard:main"},
    },
    {
        "id": "shell",
        "name": "Shell Runner",
    },
    {
        "id": "dmenu",
        "name": "dmenu Emulation",
    },
]

def fetch_catalog():
    return DEFAULT_CANDIDATES

def resolve_target_dirs():
    xdg_config = os.environ.get("XDG_CONFIG_HOME")
    if xdg_config:
        config_dir = os.path.join(xdg_config, "tflow")
    else:
        home = os.environ.get("HOME", os.path.expanduser("~"))
        config_dir = os.path.join(home, ".config", "tflow")
    return config_dir

def package_names(root):
    if not os.path.isdir(root):
        return []
    return sorted(
        name for name in os.listdir(root)
        if os.path.isfile(os.path.join(root, name, "workflow.toml"))
    )

def has_workflows(root):
    return bool(package_names(root))

def is_pid_alive(pid):
    try:
        os.kill(pid, 0)
        return True
    except (ProcessLookupError, PermissionError):
        return False

def sweep_stale_session_dirs():
    """Remove orphaned session directories from previous dead launcher processes."""
    tmp_base = tempfile.gettempdir()
    prefix = "tflow-init-"
    try:
        for entry in os.listdir(tmp_base):
            if entry.startswith(prefix):
                pid_str = entry[len(prefix):]
                if pid_str.isdigit():
                    pid = int(pid_str)
                    if not is_pid_alive(pid):
                        shutil.rmtree(os.path.join(tmp_base, entry), ignore_errors=True)
    except OSError:
        pass

def workflow_source_dir():
    """Resolve workflow sources using local checkout or a session-scoped ephemeral cache."""
    env_dir = os.environ.get("TFLOW_WORKFLOWS_BOOTSTRAP_DIR")
    if env_dir and has_workflows(env_dir):
        return os.path.realpath(env_dir)

    candidate = os.path.join(os.getcwd(), "examples", "default-suite", "workflows")
    if has_workflows(candidate):
        return os.path.realpath(candidate)

    sweep_stale_session_dirs()

    session_id = os.getppid()
    cache_dir = os.path.join(tempfile.gettempdir(), f"tflow-init-{session_id}")
    cached_source = os.path.join(cache_dir, "examples", "default-suite", "workflows")
    if has_workflows(cached_source):
        return os.path.realpath(cached_source)

    os.makedirs(cache_dir, exist_ok=True)
    try:
        subprocess.run(
            ["git", "clone", "--depth", "1", "https://github.com/xavialyra/tflow.git", cache_dir],
            check=True,
            stdout=subprocess.DEVNULL,
            stderr=subprocess.DEVNULL,
        )
    except Exception:
        shutil.rmtree(cache_dir, ignore_errors=True)
        raise

    if not has_workflows(cached_source):
        shutil.rmtree(cache_dir, ignore_errors=True)
        raise RuntimeError("Cloned repository has no example workflows")
    return os.path.realpath(cached_source)

def ensure_workflow_cache():
    return workflow_source_dir()

def core_entrypoint(cache_root):
    """`[workflow].entrypoint` of the core package: the suite must target it.

    The name belongs to the workflow package, so reading it keeps the wizard
    working with any core package instead of assuming "main".
    """
    path = os.path.join(cache_root, "core", "workflow.toml")
    try:
        with open(path, encoding="utf-8") as f:
            text = f.read()
    except OSError:
        return "main"

    in_header = False
    for line in text.splitlines():
        stripped = line.strip()
        if stripped.startswith("["):
            in_header = stripped == "[workflow]"
            continue
        if in_header and stripped.startswith("entrypoint"):
            value = stripped.partition("=")[2].strip()
            return value.strip("\"'") or "main"
    return "main"

def generate_suite_manifest(selected, entrypoint):
    catalog_map = {c["id"]: c for c in fetch_catalog()}
    selected = [wf for wf in selected if wf != "core"]

    feeds = []
    for wf in selected:
        feed = catalog_map.get(wf, {}).get("feed")
        if feed:
            feeds.append(feed)

    lines = [
        "[suite]",
        'api = 1',
        'name = "Default Suite"',
        "",
        "[suite.entrypoint]",
        f'target = "core:{entrypoint}"',
    ]
    if feeds:
        # A nested table, not an inline table: TOML 1.0 requires inline tables
        # to fit on one line and forbids trailing commas inside them.
        lines += ["", "[suite.entrypoint.query]", "sources = ["]
        lines += [f'  "{feed}",' for feed in feeds]
        lines += ["]"]

    lines += ["", "[workflows]", 'core = { dir = "./workflows/core" }']
    lines += [f'{wf} = {{ dir = "./workflows/{wf}" }}' for wf in selected]

    alias_lines = []
    for wf in selected:
        for alias, target in catalog_map.get(wf, {}).get("aliases", {}).items():
            alias_lines.append(f'{alias} = "{target}"')
    if alias_lines:
        lines += ["", "[aliases]"] + alias_lines

    return "\n".join(lines) + "\n"
            lines.append(f'{alias} = "{target}"')

    return "\n".join(lines) + "\n"

def generate_settings_manifest():
    return """# Passive host settings for tflow
[picker]
left_prefix = "$route"
left_prefix_backspace = "root"

[picker.bindings]
\"ctrl+c\" = "exit"
\"ctrl+d\" = "exit"
\"escape\" = "back"
\"up\" = "select_previous"
\"down\" = "select_next"
"""

def patch_settings_file(path):
    """Add the picker display keys to an existing settings file, once."""
    try:
        with open(path, encoding="utf-8") as f:
            text = f.read()
    except OSError:
        return "unreadable"

    if "left_prefix" in text:
        return "kept"

    display = ['left_prefix = "$route"', 'left_prefix_backspace = "root"']
    lines = text.splitlines()
    if "[picker]" in lines:
        at = lines.index("[picker]") + 1
        lines = lines[:at] + display + lines[at:]
    else:
        lines = ["[picker]"] + display + [""] + lines

    with open(path, "w", encoding="utf-8") as f:
        f.write("\n".join(lines).rstrip("\n") + "\n")
    return "updated"

def main():
    try:
        raw_input = sys.stdin.read()
        request = json.loads(raw_input) if raw_input.strip() else {}
    except Exception:
        request = {}

    context = request.get("context", {})
    parameters = context.get("parameters", {})
    selected = list(parameters.get("selected", []))

    config_dir = resolve_target_dirs()
    workflows_dir = os.path.join(config_dir, "workflows")
    os.makedirs(workflows_dir, exist_ok=True)

    cache_root = ensure_workflow_cache()
    if cache_root is None:
        print(
            "No workflow source found: set TFLOW_WORKFLOWS_BOOTSTRAP_DIR to the example suite workflows directory.",
            file=sys.stderr,
        )
        sys.exit(1)

    to_install = [
        wf for wf in selected
        if os.path.isfile(os.path.join(cache_root, wf, "workflow.toml"))
    ]
    missing = [wf for wf in selected if wf not in to_install]
    if "core" not in to_install:
        to_install.append("core")

    installed = []
    for wf in to_install:
        source = os.path.join(cache_root, wf)
        target = os.path.join(workflows_dir, wf)
        # Replace instead of merge: a merged copy keeps every file the source
        # has dropped, which is how a stale script survives a reinstall.
        shutil.rmtree(target, ignore_errors=True)
        shutil.copytree(
            source,
            target,
            ignore=shutil.ignore_patterns("__pycache__", "*.pyc", ".bootstrap-*"),
        )
        installed.append(wf)

    # A deselected component must leave the installed tree as well.
    for candidate in fetch_catalog():
        cid = candidate["id"]
        if cid == "core" or cid in to_install:
            continue
        if os.path.isfile(os.path.join(cache_root, cid, "workflow.toml")):
            shutil.rmtree(os.path.join(workflows_dir, cid), ignore_errors=True)

    suite_file = os.path.join(config_dir, "default.toml")
    settings_file = os.path.join(config_dir, "settings.toml")

    # The marker's first field is the resolved source, so the summary can show
    # where this install was copied from rather than just where it landed.
    source_note = "unknown (cache only)"
    try:
        with open(os.path.join(cache_root, ".bootstrap-source"), encoding="utf-8") as f:
            source_note = f.read().strip().split("|")[0] or source_note
    except OSError:
        pass

    with open(suite_file, "w", encoding="utf-8") as f:
        f.write(generate_suite_manifest(installed, core_entrypoint(cache_root)))

    if os.path.exists(settings_file):
        settings_state = patch_settings_file(settings_file)
    else:
        with open(settings_file, "w", encoding="utf-8") as f:
            f.write(generate_settings_manifest())
        settings_state = "written"

    check_state = "skipped (tflow not found)"
    tflow_bin = os.environ.get("TFLOW_BIN") or shutil.which("tflow")
    if tflow_bin:
        check = subprocess.run(
            [tflow_bin, "-s", suite_file, "-c", settings_file, "--check"],
            capture_output=True,
            text=True,
        )
        if check.returncode == 0:
            check_state = "ok"
        else:
            detail = (check.stderr or check.stdout).strip().replace("\n", " ")
            check_state = f"FAILED: {detail}"

    installed_str = ", ".join(installed) if installed else "(none)"
    missing_line = f"  Skipped:          {', '.join(missing)}\n" if missing else ""

    session_id = os.getppid()
    session_cache = os.path.join(tempfile.gettempdir(), f"tflow-init-{session_id}")
    shutil.rmtree(session_cache, ignore_errors=True)

    msg = f"""
\033[1;32m🎉 [✓] tflow configuration installed successfully!\033[0m
============================================================
  Suite Manifest:   {suite_file}
  Settings File:    {settings_file} ({settings_state})
  Workflows Dir:    {workflows_dir}
  Workflow Source:  {source_note}
  Workflow Cache:   {cache_root}
  Active Workflows: {installed_str}
{missing_line}  Config Check:     {check_state}
============================================================

You are ready to launch! Try running:
  \033[1;36mtflow\033[0m               # Open unified launcher (core)
  \033[1;36mtflow app\033[0m           # Search & launch applications
  \033[1;36mtflow calc\033[0m          # Quick math calculator
  \033[1;36mtflow sys\033[0m           # Power and session menu
"""

    json.dump(
        {
            "version": 1,
            "operation": {
                "type": "run",
                "argv": [sys.executable, "-c", "import sys; print(sys.argv[1])", msg],
                "exit": True,
            },
        },
        sys.stdout,
        separators=(",", ":"),
    )
    sys.stdout.write("\n")

if __name__ == "__main__":
    main()
'''

