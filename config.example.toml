# Copy this file to ~/.config/tui-launcher/config.toml or pass it with --config.

[providers.actions]
display_prefix = "action"
discover = '''
printf '%s\n' '{"label":"Show date"}' '{"label":"Show system information"}' '{"label":"Sync dotfiles"}'
'''
run = '''
case "$LAUNCHER_ITEM" in
  "Show date") date ;;
  "Show system information")
    uname -a
    printf '\n'
    id
    ;;
  "Sync dotfiles") printf 'dotfiles sync would run here\n' ;;
esac
'''
mode = "capture"

[providers.bookmarks]
display_prefix = "bookmark"
discover = '''
printf '%s\n' '{"label":"Open project documentation"}' '{"label":"Open issue tracker"}'
'''
run = '''
case "$LAUNCHER_ITEM" in
  "Open project documentation") printf 'documentation action\n' ;;
  "Open issue tracker") printf 'issue tracker action\n' ;;
esac
'''
mode = "capture"

[providers.ssh-hosts]
display_prefix = "ssh"
discover_shell = "sh"
# The provider is route-only; query_discover runs after `ssh ` is entered.
query_discover = '''
hosts='prod-web-01 prod-api-01 staging-api dev-gpu'
for host in $hosts; do
  printf '{"label":"%s","value":"%s"}\n' "$host" "$host"
done
'''
run = '''
exec ssh "$LAUNCHER_VALUE"
'''
mode = "takeover"

[providers.system-actions]
display_prefix = "system"
discover = '''
printf '%s\n' '{"label":"Battery status"}' '{"label":"Audio status"}' '{"label":"Reload desktop bar"}'
'''
run = '''
case "$LAUNCHER_ITEM" in
  "Battery status") upower -i "$(upower -e | head -1)" ;;
  "Audio status") pactl info ;;
  "Reload desktop bar") printf 'reload action would run here\n' ;;
esac
'''
mode = "capture"
